name: Release

# Publishes the NuGet packages to nuget.org as soon as a version tag is pushed:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Authentication uses Trusted Publishing (OIDC), NOT a stored API key. Since
# 2026-08-17 new nuget.org API keys are capped at 30 days and all older ones expire
# on 2026-11-01, so a stored key would mean permanent maintenance.
#
# One-time setup on nuget.org (user menu -> "Trusted Publishing"):
#   Repository Owner : Samedis-care
#   Repository       : samedis-care-dotnet
#   Workflow File    : release.yml        <-- file name only, without .github/workflows/
#   Environment      : (leave empty — this workflow declares no GitHub environment)
#   Glob Patterns    : SamedisCare.*
#
# Also add as a repository secret:
#   NUGET_USER = nuget.org profile name (NOT the email address, and not the
#                organization name — the account that owns the policy)

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    name: Pack & publish to nuget.org
    runs-on: ubuntu-latest

    # Fork protection: a tag in a fork must never publish under our package name.
    if: github.repository == 'Samedis-care/samedis-care-dotnet'

    permissions:
      contents: write   # for the GitHub release
      id-token: write   # for the OIDC token sent to nuget.org

    steps:
      - uses: actions/checkout@v7

      # All three runtimes: the package contains net8.0/net9.0/net10.0, and the tests
      # should have run against each of them before publishing.
      - name: Setup .NET 8/9/10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # v0.1.0 -> 0.1.0. A NuGet version must not carry a leading "v".
      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore SamedisCare.Dotnet.sln

      - name: Build
        run: dotnet build SamedisCare.Dotnet.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      # Tests run on the release path too — a package whose tests are red must not end
      # up on nuget.org, because a published version cannot be removed or reused.
      - name: Test
        run: dotnet test SamedisCare.Dotnet.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack SamedisCare.Dotnet.sln -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.value }}

      # Fetches a short-lived API key (1 hour, single use) via OIDC. Must sit
      # immediately before the push, otherwise the key can expire.
      - name: NuGet login (OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate: a re-run on the same tag does not fail hard.
      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "SamedisCare.Api ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*.nupkg
