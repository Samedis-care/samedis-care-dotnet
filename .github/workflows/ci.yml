name: CI

# Builds the library, runs the tests and packs the NuGet packages — without publishing.
# Packing runs here on purpose: it surfaces errors in the package metadata (missing
# description, broken README path, invalid version) in the pull request rather than at
# release time, where a failed attempt can mean a burned version number.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, develop ]

jobs:
  build:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # All three runtimes, because the test suite runs once per target framework of
      # the package. Without the .NET 9 runtime the net9.0 variant would ship untested.
      - name: Setup .NET 8/9/10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore SamedisCare.Dotnet.sln

      - name: Build
        run: dotnet build SamedisCare.Dotnet.sln -c Release --no-restore

      - name: Test
        run: dotnet test SamedisCare.Dotnet.sln -c Release --no-build --verbosity normal

      # Dry run to validate the metadata only. The version stays at the default from
      # Directory.Build.props here — the real version comes from the git tag on release.
      - name: Pack (validation)
        run: dotnet pack SamedisCare.Dotnet.sln -c Release --no-build -o artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*
          if-no-files-found: error
