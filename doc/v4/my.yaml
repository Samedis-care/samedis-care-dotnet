            <summary>The model defined these fields as allowed for filtering.</summary>

            `_id`, `_keywords`, `_keywords_plain`, `_type`, `aas_canonical_id`, `aliases`, `avatar_data`, `categories`, `changelog_version`, `company_id`, `country`, `created_at`, `created_by`, `created_by_user`, `created_by_user_mdm_edited`, `email`, `enterprise_tenant_id`, `fax`, `first_name`, `ident_user_id`, `is_public`, `last_name`, `merged_with`, `mobile`, `name`, `notes`, `owner_tenant_id`, `phone`, `salutation`, `srn`, `street`, `tenant_id`, `tenant_name`, `town`, `trust_level`, `uniq_name`, `updated_at`, `updated_by`, `updated_by_user`, `updated_by_user_at`, `updated_by_user_mdm_edited`, `url`, `urn`, `urns`, `zip`

          </details>

          <details>
            <summary>These fields additionally support the full-text `search` condition (Atlas Search backend required).</summary>

            `country`, `email`, `first_name`, `last_name`, `name`, `phone`, `srn`, `town`, `uniq_name`, `url`, `urn`

            Query syntax (in `filter`): `+required` `-excluded` `a OR b` `foo*` / `f?o` (wildcards) `"exact phrase"`.

            `type`: `matches` (records matching the query) or `not_matches` (the complement).

            ```json
             {
               "country":{
                 "filterType":"search",
                 "type":"matches",
                 "filter":"+Katalog +Beatmung"
               }
             }
            ```

          </details>

          <details>
            <summary>Detailed example</summary>

            ```json
             {
               "created_at":{
                 "filterType":"date",
                 "type":"inRange",
                 "dateFrom":"2019-03-31",
                 "dateTo":"2019-07-31"
               },
               "sign_in_count":{
                 "condition1":{
                   "filterType":"number",
                   "type":"inRange",
                   "filter":0,
                   "filterTo":1000000
                 },
                 "condition2":{
                   "filterType":"number",
                   "type":"notEqual",
                   "filter":"666.777"
                 },
                 "filterType":"number",
                 "operator":"AND"
               },
               "email":{
                 "condition1":{
                   "filterType":"text",
                   "type":"contains",
                   "filter":"gmail.com"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"equals",
                   "filter":"tdouglas@domain.local"
                 },
                 "filterType":"text",
                 "operator":"OR"
               },
               "first_name":{
                 "condition1":{
                   "filterType":"text",
                   "type":"endsWith",
                   "filter":"gan"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"startsWith",
                   "filter":"Te"
                 },
                 "filterType":"text",
                 "operator":"AND"
               },
               "last_name":{
                 "filterType":"text",
                 "type":"notContains",
                 "filter":"Brakus"
               },
               "active": {
                 "filterType": "bool",
                 "type": "equals",
                 "filter": true
               }
             }
            ```

          </details>
      responses:
        '200':
          description: Companies list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                description: List endpoints will return an array below data
                properties:
