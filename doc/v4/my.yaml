               }
             }
            ```

          </details>

          <details>
            <summary>Detailed example</summary>

            ```json
             {
               "created_at":{
                 "filterType":"date",
                 "type":"inRange",
                 "dateFrom":"2019-03-31",
                 "dateTo":"2019-07-31"
               },
               "sign_in_count":{
                 "condition1":{
                   "filterType":"number",
                   "type":"inRange",
                   "filter":0,
                   "filterTo":1000000
                 },
                 "condition2":{
                   "filterType":"number",
                   "type":"notEqual",
                   "filter":"666.777"
                 },
                 "filterType":"number",
                 "operator":"AND"
               },
               "email":{
                 "condition1":{
                   "filterType":"text",
                   "type":"contains",
                   "filter":"gmail.com"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"equals",
                   "filter":"tdouglas@domain.local"
                 },
                 "filterType":"text",
                 "operator":"OR"
               },
               "first_name":{
                 "condition1":{
                   "filterType":"text",
                   "type":"endsWith",
                   "filter":"gan"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"startsWith",
                   "filter":"Te"
                 },
                 "filterType":"text",
                 "operator":"AND"
               },
               "last_name":{
                 "filterType":"text",
                 "type":"notContains",
                 "filter":"Brakus"
               },
               "active": {
                 "filterType": "bool",
                 "type": "equals",
                 "filter": true
               }
             }
            ```

          </details>
      - name: filter[types]
        in: query
        description: Filter by one or more (comma separated) tag types
        schema:
          type: string
          enum:
          - ''
          - area_of_application
