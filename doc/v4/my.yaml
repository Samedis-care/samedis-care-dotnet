          or more fields in the requested order.
          Example:
          `[{ property: "field1", direction: "ASC" }, { property: "field2", direction: "DESC" }]`
      - name: gridfilter
        in: query
        schema:
          type: string
        description: |
          String in JSON format as described in https://github.com/Samedis-care/samedis-care-community/wiki/03---API-Gridfilter

          <details>
            <summary>The model defined these fields as allowed for filtering.</summary>

            `_ical_event`, `_ical_event_instructor_ids`, `_ical_event_staff_ids`, `_id`, `_keywords`, `_keywords_device_models`, `_keywords_plain`, `_keywords_staffs`, `briefing_number`, `briefing_type`, `catalog_current_manufacturer`, `catalog_device_model_types`, `catalog_device_types`, `changelog_version`, `completed`, `created_at`, `created_by`, `created_by_user`, `created_by_user_mdm_edited`, `date`, `deleted`, `deleted_at`, `device_models`, `device_types`, `enterprise_tenant_id`, `imported`, `instructor`, `instructor_signature`, `invalidate_reason`, `invalidated_by`, `is_digital`, `is_my_samedis_import`, `remark`, `skip_briefing_reports`, `staff_ident_user_ids`, `status`, `tag`, `tags`, `tenant_id`, `tenant_name`, `title`, `updated_at`, `updated_by`, `updated_by_user`, `updated_by_user_at`, `updated_by_user_mdm_edited`, `vendor_company`, `vendors`

          </details>

          <details>
            <summary>These fields additionally support the full-text `search` condition (Atlas Search backend required).</summary>

            `_keywords`, `_keywords_device_models`, `_keywords_staffs`

            Query syntax (in `filter`): `+required` `-excluded` `a OR b` `foo*` / `f?o` (wildcards) `"exact phrase"`.

            `type`: `matches` (records matching the query) or `not_matches` (the complement).

            ```json
             {
               "_keywords":{
                 "filterType":"search",
                 "type":"matches",
                 "filter":"+Katalog +Beatmung"
               }
             }
            ```

          </details>

          <details>
            <summary>Detailed example</summary>

            ```json
             {
               "created_at":{
                 "filterType":"date",
                 "type":"inRange",
                 "dateFrom":"2019-03-31",
                 "dateTo":"2019-07-31"
               },
               "sign_in_count":{
                 "condition1":{
                   "filterType":"number",
                   "type":"inRange",
                   "filter":0,
                   "filterTo":1000000
                 },
                 "condition2":{
                   "filterType":"number",
                   "type":"notEqual",
                   "filter":"666.777"
                 },
                 "filterType":"number",
                 "operator":"AND"
               },
               "email":{
                 "condition1":{
                   "filterType":"text",
                   "type":"contains",
                   "filter":"gmail.com"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"equals",
                   "filter":"tdouglas@domain.local"
                 },
                 "filterType":"text",
                 "operator":"OR"
               },
               "first_name":{
                 "condition1":{
                   "filterType":"text",
                   "type":"endsWith",
                   "filter":"gan"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"startsWith",
                   "filter":"Te"
                 },
                 "filterType":"text",
                 "operator":"AND"
               },
               "last_name":{
                 "filterType":"text",
                 "type":"notContains",
                 "filter":"Brakus"
               },
               "active": {
                 "filterType": "bool",
                 "type": "equals",
                 "filter": true
               }
             }
            ```

          </details>
      - name: filter[status]
        in: query
        description: Allows filtering for an array (or comma separated string) of
          one or more state
        schema:
          type: string
          enum:
          - ''
          - _new
          - draft
          - open
          - done
          - closed
          - invalid
          default: ''
          nullable: true
      responses:
        '200':
          description: Briefings list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                description: List endpoints will return an array below data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          default: briefing
                        attributes:
                          "$ref": "#/components/schemas/BriefingOverviewSerializer"
                  meta:
                    "$ref": "#/components/schemas/meta"
        '400':
          description: Some values that were sent couldn't be processed
          content:
            application/json:
              schema:
                type: object
                description: Check the returned info in meta/msg for details
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                description: Wait for so many seconds as returned in the Retry-After
                  header before accessing this endpoint again
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                description: Requires a valid login
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '402':
          description: Subscription required
          content:
            application/json:
              schema:
                type: object
                description: This feature requires some extra subscription that is
                  missing
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                type: object
                description: User is missing the access rights to do this
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
