        description: |
          String in JSON format as described in https://github.com/Samedis-care/samedis-care-community/wiki/03---API-Gridfilter

          <details>
            <summary>The model defined these fields as allowed for filtering.</summary>

            `_id`, `_keywords`, `_keywords_device_model`, `_keywords_device_type`, `_keywords_plain`, `briefing_id`, `catalog_id`, `changelog_version`, `created_at`, `created_by`, `created_by_user`, `created_by_user_mdm_edited`, `device_model_combo_search`, `device_model_current_responsible_manufacturer`, `device_model_id`, `device_model_manufacturer_according_to_type_plate`, `device_model_notified_body_ce`, `device_model_operator_ordinance`, `device_model_related_data_checksum`, `device_model_risk_level`, `device_model_title`, `device_model_trust_level`, `device_model_udi`, `device_model_version`, `device_model_version_number`, `device_type_id`, `device_type_title`, `device_type_title_labels`, `ident_user_id`, `instructor_company`, `instructor_name`, `is_manufacturer_training`, `is_routing_slip`, `linked_image_data`, `linked_image_id`, `my_training_import_request_ids`, `remark`, `self_documented`, `staff_id`, `status`, `tenant_id`, `tenant_name`, `trained_at`, `training_title`, `training_type`, `updated_at`, `updated_by`, `updated_by_user`, `updated_by_user_at`, `updated_by_user_mdm_edited`, `urn`

