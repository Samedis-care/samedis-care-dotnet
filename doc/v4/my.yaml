                   "filterType":"number",
                   "type":"notEqual",
                   "filter":"666.777"
                 },
                 "filterType":"number",
                 "operator":"AND"
               },
               "email":{
                 "condition1":{
                   "filterType":"text",
                   "type":"contains",
                   "filter":"gmail.com"
