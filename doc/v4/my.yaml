    meta:
      type: object
      description: Base and minimum information returned for every response under
        the `meta` key of the the JSON root
      required:
      - locale
      - current_user_id
      - msg
      properties:
        git_version:
          type: string
          description: backend version string
        total:
          type: number
          description: number of total records
        json_api_options:
          type: object
          properties:
            limit:
              type: number
              default: 10
              description: page size - maximum number of records returned in a request
            page:
              type: number
              default: 1
              description: the current page number
            fields:
              type: object
              description: if the request was sent with fields parameter (comma separated
                field names) this shows which fields were requested
              properties: {}
        locale:
          type: string
          default: en
          description: the currently selected locale
        current_user_id:
          type: string
          description: the user id currently authenticated
        status:
          type: number
          description: optionally repeating the http status code
        msg:
          type: object
          description: info about the request
          required:
          - success
          properties:
            success:
              type: boolean
              default: true
              description: indicates successful requests
            message:
              type: string
              description: if unsuccessful contains a detailed error message
            error:
              type: string
              description: if unsuccessful contains an error name
              enum:
              - ''
              - already_signed
              - argument_error
              - authorization_error
              - bulk_update_error
              - conflict
              - cross_tenant_conflict
              - database_error
              - duplicate_key_error
              - forbidden
              - general_error
              - gridfilter_error
              - invalid
              - invalid_catalog_id
              - invalid_file_error
              - invitation_error
              - invite_rate_limited
              - maintenance
              - maintenance_readonly
              - malformed_csv_error
              - malformed_json
              - max_time_ms_exceeded
              - missing_tenant_context
              - no_device_models_selected
              - no_employees_selected
              - no_file
              - no_staff_linked_to_user_error
              - not_a_sync_api_subscriber
              - not_signable
              - object_id_invalid
              - record_error
              - record_not_found_error
              - self_merge_error
              - sentry_tunnel_error
              - signature_required
              - smtp_syntax_error
              - subscription_expired
              - tenant_not_found
              - too_many_requests
              - unauthenticated
              - unauthorized
              - unknown_token
              - unknown_transition
              - unsupported_image_error
            error_details:
              description: |-
                If available holds details about why an error occured
                (e.g. listing involved attributes).
              oneOf:
              - type: string
                nullable: true
              - type: array
                items:
                  type: string
              - type: object
                additionalProperties: {}
        warnings:
          type: array
          description: non-blocking advisory warnings; absent when no warnings apply
          items:
            type: object
            required:
            - warning
            - attribute
            - message
            properties:
              warning:
                type: string
                description: machine code identifying the warning kind
                enum:
                - circular_instruction
                - info
              attribute:
                type: string
                description: attribute path the warning is bound to (e.g. "base",
                  "date"); parallel to JSON:API errors[].source.pointer.
              message:
                type: string
                description: localized human-readable warning text
              warning_details:
                description: optional structured payload with details about the warning
                oneOf:
                - type: object
                  additionalProperties: {}
                  nullable: true
    'null':
      type: string
      nullable: true
      title: OpenAPI 3.0 null-type ref
      description: for adding nullability to a field
    relationships:
      type: object
      description: Optional listing of associated records if available
      additionalProperties:
        type: object
        description: key being the name of the relation
        required:
        - data
        properties:
          data:
            anyOf:
            - "$ref": "#/components/schemas/null"
            - type: object
              required:
              - id
              - type
              properties:
                id:
                  type: string
                type:
                  type: string
              description: single relation reference in case of one-to-one
            - type: array
              description: array of relation references in case of one-to-many
              items:
                type: object
                required:
                - id
                - type
