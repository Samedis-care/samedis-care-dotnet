openapi: 3.1.1
paths:
  "/api/v4/my/departments":
    get:
      summary: 'Departments: List [GET]'
      tags:
      - Departments
      operationId: my-departments-index
      x-controller: Api::V4::My::DepartmentsController
      x-controller-action: index
      x-controller-action-request-limit: 100
      x-controller-action-request-limit-duration: 60
      x-route-name: v4_my_departments
      x-candos:
      - public
      x-model-type: Department
      x-record-type: department_overview
      x-gridfilter-fields:
      - _id
      - _keywords
      - _keywords_plain
      - changelog_version
      - cost_center_number
      - cost_center_numbers
      - created_at
      - created_by
      - created_by_user
      - created_by_user_mdm_edited
      - enterprise_tenant_id
      - inventory_count
      - is_active
      - notes
      - profit_center_title
      - staff_ids
      - tag
      - tags
      - tenant_id
      - tenant_name
      - title
      - updated_at
      - updated_by
      - updated_by_user
      - updated_by_user_at
      - updated_by_user_mdm_edited
      x-search-fields:
      - cost_center_number
      - notes
      - title
      description: "This endpoint lists the departments of all facilities the user
        is associated with.\nThe resulting IDs can then be used to filter other endpoints.\n***currently
        not in use***\n\n---\n\nTo use this endpoint the current user needs to be
        authorized for the\ntenant to do any of these\n\n - public\n\n---\n\nThis
        endpoint is limited to\n100\nrequests per 60 seconds.\n\nIf this limit is
        exhausted the server will return HTTP status 429 \nAnd a header `Retry-After`
        with the number of seconds the client's user \naccount needs to wait before
        the endpoint will allow further requests.\n\nClients using this endpoint should
        implement a delay handling to wait the given\nseconds before retrying and
        avoid repeating previous requests that finished\nsuccessfully."
      security:
      - Bearer: []
      parameters:
      - name: locale
        in: query
        description: to control the language returned
        schema:
          "$ref": "#/components/schemas/locales"
      - name: quickfilter
        in: query
        schema:
          type: string
        description: performs a search in keywords
      - name: page[number]
        in: query
        schema:
          type: string
        x-example: '1'
        description: |
          the page number (starts at 1, if not given or lower than 1 then
          page 1 will automatically be assumed)'
      - name: page[limit]
        in: query
        schema:
          type: string
        x-example: '10'
        description: the number of records per page (might be limited on the server
          side, use 0 to fetch no data to get only the total count)
      - name: padding
        in: query
        schema:
          type: string
        x-example: '0'
        description: 'manually adjust db offset: (page*per_page)+padding not required
          for normal paging, in doubt omit'
      - name: sort
        in: query
        schema:
          type: string
        description: |
          JSON Array of Objects to sort the results by one
          or more fields in the requested order.
          Example:
          `[{ property: "field1", direction: "ASC" }, { property: "field2", direction: "DESC" }]`
      - name: gridfilter
        in: query
        schema:
          type: string
        description: |
          String in JSON format as described in https://github.com/Samedis-care/samedis-care-community/wiki/03---API-Gridfilter

          <details>
            <summary>The model defined these fields as allowed for filtering.</summary>

            `_id`, `_keywords`, `_keywords_plain`, `changelog_version`, `cost_center_number`, `cost_center_numbers`, `created_at`, `created_by`, `created_by_user`, `created_by_user_mdm_edited`, `enterprise_tenant_id`, `inventory_count`, `is_active`, `notes`, `profit_center_title`, `staff_ids`, `tag`, `tags`, `tenant_id`, `tenant_name`, `title`, `updated_at`, `updated_by`, `updated_by_user`, `updated_by_user_at`, `updated_by_user_mdm_edited`

          </details>

          <details>
            <summary>These fields additionally support the full-text `search` condition (Atlas Search backend required).</summary>

            `cost_center_number`, `notes`, `title`

            Query syntax (in `filter`): `+required` `-excluded` `a OR b` `foo*` / `f?o` (wildcards) `"exact phrase"`.

            `type`: `matches` (records matching the query) or `not_matches` (the complement).

            ```json
             {
               "cost_center_number":{
                 "filterType":"search",
                 "type":"matches",
                 "filter":"+Katalog +Beatmung"
               }
             }
            ```

          </details>

          <details>
            <summary>Detailed example</summary>

            ```json
             {
               "created_at":{
                 "filterType":"date",
                 "type":"inRange",
                 "dateFrom":"2019-03-31",
                 "dateTo":"2019-07-31"
               },
               "sign_in_count":{
                 "condition1":{
                   "filterType":"number",
                   "type":"inRange",
                   "filter":0,
                   "filterTo":1000000
                 },
                 "condition2":{
                   "filterType":"number",
                   "type":"notEqual",
                   "filter":"666.777"
                 },
                 "filterType":"number",
                 "operator":"AND"
               },
               "email":{
                 "condition1":{
                   "filterType":"text",
                   "type":"contains",
                   "filter":"gmail.com"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"equals",
                   "filter":"tdouglas@domain.local"
                 },
                 "filterType":"text",
                 "operator":"OR"
               },
               "first_name":{
                 "condition1":{
                   "filterType":"text",
                   "type":"endsWith",
                   "filter":"gan"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"startsWith",
                   "filter":"Te"
                 },
                 "filterType":"text",
                 "operator":"AND"
               },
               "last_name":{
                 "filterType":"text",
                 "type":"notContains",
                 "filter":"Brakus"
               },
               "active": {
                 "filterType": "bool",
                 "type": "equals",
                 "filter": true
               }
             }
            ```

          </details>
      - name: filter[is_active]
        in: query
        description: Allows filtering for active state
        schema:
          type: string
          enum:
          - ''
          - 'true'
          - 'false'
          - both
          default: 'true'
          nullable: true
      responses:
        '200':
          description: Departments list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                description: List endpoints will return an array below data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          default: department_overview
                        attributes:
                          "$ref": "#/components/schemas/DepartmentOverviewSerializer"
                  meta:
                    "$ref": "#/components/schemas/meta"
        '400':
          description: Some values that were sent couldn't be processed
          content:
            application/json:
              schema:
                type: object
                description: Check the returned info in meta/msg for details
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                description: Wait for so many seconds as returned in the Retry-After
                  header before accessing this endpoint again
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                description: Requires a valid login
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '402':
          description: Subscription required
          content:
            application/json:
              schema:
                type: object
                description: This feature requires some extra subscription that is
                  missing
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                type: object
                description: User is missing the access rights to do this
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
