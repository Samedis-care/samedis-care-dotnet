---
info:
  title: my.Samedis.care API V4
  contact:
    name: Samedis Care GmbH
    email: info@samedis.care
    url: https://github.com/Samedis-care/samedis-care-community/wiki
  version: v4
  description: |-
    ## This is the my.Samedis.care API V4
    > Endpoints here serve user specific data only.
components:
  securitySchemes:
    Bearer:
      description: |
        # Token based authentication Header
        Authenticate and then copy the token into this field without the "Bearer " prefix.

        ## To obtain a bearer token
        Use the `https://ident.services/api/v1/samedis-care/oauth/token` endpoint.
        See [Ident Services API documentation](https://ident.services/api-docs/) for reference.
      type: http
      scheme: bearer
  schemas:
    BriefingCatalogSerializer:
      type: object
      description: Full attributes of the device models that are instructed at a training
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
          description: tenant id this record is owned by
        catalog_id:
          type: string
          description: the id of the catalog object
        created_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was created
        created_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who created the record
        device_form_title:
          type: string
          deprecated: true
          description: "(DEPRECATED), use device_model_title instead"
          nullable: true
        device_model_title:
          type: string
          description: device model title
        device_type_title:
          type: string
          description: device type title
        instruction_date:
          type: string
          description: the date when the briefing takes place
        instruction_type:
          type: string
          description: instruction type
          enum:
          - internal
          - vendor
        instructor_company:
          type: string
          description: instructor company (if vendor instruction)
        instructor_id:
          type: string
          description: staff id of the instructor
        instructor_name:
          type: string
          description: instructors name
        instructor_signature:
          type: object
          description: signature
          properties:
            base_64:
              type: string
              description: Base64 encoded signature
        instructor_signature_id:
          type: string
          description: id to the signature
        manufacturer_according_to_type_plate:
          type: string
          description: manufacturer according to type plate
        type_catalog_title:
          type: string
          deprecated: true
          description: "(DEPRECATED), use device_type_title instead"
          nullable: true
        updated_at:
          type: string
          format: date_time
          readOnly: true
          description: system timestamp the record was last updated
        updated_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who last updated the record
        updated_by_user_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was last updated_by_user
    BriefingOverviewSerializer:
      type: object
      description: Limited attributes for listings of trainings
      required:
      - briefing_type
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
          description: tenant id this record is owned by
        briefing_type:
          type: string
          enum:
          - internal
          - vendor
          - employee
          description: type of this briefing
        completed:
          type: boolean
          description: true if status closed
        created_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was created
        created_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who created the record
        date:
          type: string
          format: date
          description: date for the briefing
        device_models:
          type: string
          description: titles of the device models trained
        device_types:
          type: string
          description: titles of the device types trained
        instructor:
          type: string
          nullable: true
          description: instructor Name
        instructor_id:
          type: string
          nullable: true
          description: staff id of the instructor (if internally trained)
        is_digital:
          type: boolean
          description: indicates if this is run by paper or fully app supported
        remark:
          type: string
          nullable: true
          description: remark for this briefing
        status:
          type: string
          enum:
          - draft
          - open
          - done
          - closed
          description: status of this briefing
        title:
          type: string
          description: title of the briefing
        updated_at:
          type: string
          format: date_time
          readOnly: true
          description: system timestamp the record was last updated
        updated_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who last updated the record
        updated_by_user_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was last updated_by_user
        vendor_company:
          type: string
          nullable: true
          description: vendor company
        vendors:
          type: string
          description: manufacturer names of the device models trained
    BriefingSerializer:
      type: object
      description: Full attributes of trainings
      required:
      - briefing_type
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
          description: tenant id this record is owned by
        briefing_type:
          type: string
          enum:
          - internal
          - vendor
          - employee
          description: type of this briefing
        completed:
          type: boolean
          description: true if status closed
        created_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was created
        created_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who created the record
        date:
          type: string
          format: date
          description: date for the briefing
        device_model_ids:
          type: array
          description: IDs of device models assigned to this training
          items:
            type: string
            description: Device model id
        device_models:
          type: string
          description: titles of the device models trained
        device_types:
          type: string
          description: titles of the device types trained
        instructor:
          type: string
          nullable: true
          description: instructor Name
        instructor_id:
          type: string
          nullable: true
          description: staff id of the instructor (if internally trained)
        invalidate_reason:
          type: string
          nullable: true
          description: reason to invalidate the briefing
        is_digital:
          type: boolean
          description: indicates if this is run by paper or fully app supported
        remark:
          type: string
          nullable: true
          description: remark for this briefing
        staff_ids:
          type: array
          description: IDs of staff assigned to this training
          items:
            type: string
            description: Staff id
        status:
          type: string
          enum:
          - draft
          - open
          - done
          - closed
          description: status of this briefing
        title:
          type: string
          description: title of the briefing
        updated_at:
          type: string
          format: date_time
          readOnly: true
          description: system timestamp the record was last updated
        updated_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who last updated the record
        updated_by_user_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was last updated_by_user
        vendor_company:
          type: string
          nullable: true
          description: vendor company
        vendors:
          type: string
          description: manufacturer names of the device models trained
    BriefingSerializer.Links:
      type: object
      properties:
        instructor_signature:
          type: string
          format: base64
          nullable: true
          description: data-URI of the instructor signature
        routing_slip:
          type: string
          format: uri_reference
          nullable: true
          description: URL to the PDF (if this is an employee briefing)
        qr_code_url:
          type: string
          format: uri_reference
          nullable: true
          description: frontend URL encoded into the participant signing QR code (`<frontend>/training-sign?token=<token>`);
            null when the briefing is not signable (paper, wrong type, or status not
            open/done)
        signing_qr_code:
          type: string
          format: base64
          nullable: true
          description: data-URI (SVG) of the participant signing QR code; same URL
            as `qr_code_url` rendered via rqrcode
    BriefingStaffSerializer:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
          description: tenant id this record is owned by
        created_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was created
        created_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who created the record
        staff_id:
          type: string
          description: the id of the staff
        staff_signature_id:
          type: string
          nullable: true
          description: the id of the signature
        updated_at:
          type: string
          format: date_time
          readOnly: true
          description: system timestamp the record was last updated
        updated_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who last updated the record
        updated_by_user_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was last updated_by_user
    BriefingStaffSerializer.Links:
      type: object
      properties:
        sign:
          type: string
          format: base64
          nullable: true
          description: data-URI of the employee signature
    CatalogOverviewSerializer:
      type: object
      description: Limited attributes used for listings of device models
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
          description: tenant id this record is owned by
        aas_shell_url:
          type: string
          readOnly: true
          nullable: true
          description: URL to fetch the full AAS shell of this device model
        associated_version_ids:
          type: array
          description: ids of versioned device models
          items:
            type: string
        available_in_countries:
          "$ref": "#/components/schemas/countries"
        briefing_count:
          type: number
          description: number of associated briefings of the catalog
        ce:
          type: boolean
          nullable: true
          deprecated: true
          description: "(DEPRECATED), use regulatory instead"
        created_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was created
        created_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who created the record
        current_responsible_manufacturer:
          type: string
          readOnly: true
          nullable: true
          description: current responsible manufacturer
        device_form_title:
          type: string
          deprecated: true
          description: "(DEPRECATED), use title instead"
          nullable: true
        device_picture:
          type: string
          nullable: true
          readOnly: true
          description: url to the device picture (if available)
        device_tag_ids:
          type: array
          description: ids of assigned device tags
          items:
            type: string
        device_type_category:
          type: string
          deprecated: true
          description: "(DEPRECATED), use device_type_title instead"
          nullable: true
        device_type_id:
          type: string
          description: device type id
        device_type_tag_ids:
          type: array
          description: ids of inherited device type tags
          items:
            type: string
        device_type_title:
          type: string
          readOnly: true
          description: device type title
        device_type_title_labels:
          "$ref": "#/components/schemas/translations_read_only"
        embedded_device_tags:
          type: array
          description: assigned device tags
          items:
            type: object
            description: |-
              Hash of locale-languages with translated tag names.
              Can be any 2 digit language code."
              Must be at least 2 characters,
              but no more than 80.
            properties:
              id:
                type: string
                readOnly: true
                description: unique record id
              type:
                type: string
                description: tag type
                enum:
                - area_of_application
                - device_type
                - purpose
                - technical_property
              name:
                type: string
                description: unique tag name lower+snakecase
              labels:
                "$ref": "#/components/schemas/translations_read_only"
        emtec_code:
          type: string
          nullable: true
          deprecated: true
          description: "(DEPRECATED), use regulatory instead"
        end_of_life:
          type: boolean
          readOnly: true
          description: true if end_of_life_at present and reached current date
        end_of_life_at:
          type: string
          format: date
          nullable: true
          example: '2026-12-31'
          description: possible date defined by manufacturer for the products end
            of life
        end_of_service:
          type: boolean
          readOnly: true
          description: true if end_of_service_at present and reached current date
        end_of_service_at:
          type: string
          format: date
          nullable: true
          example: '2026-06-30'
          description: possible date defined by manufacturer for the products end
            of service
        external_id:
          type: string
          maxLength: 50
          nullable: true
          description: optional unique (within tenant context) identifier that can
            be assigned by the facility
        iec_safety_class:
          type: string
          nullable: true
          enum:
          - class_1
          - class_2
          - internally_powered
          description: IEC 60601 safety (protection) class
        iec_safety_type:
          type: string
          nullable: true
          enum:
          - type_b
          - type_bf
          - type_cf
          description: IEC 60601 applied part type
        inventory_count:
          type: number
          description: number of inventories of the catalog
        inventory_loaner_device_count:
          type: number
          description: number of inventories with ownership loaner device
        inventory_owned_count:
          type: number
          description: number of inventories with ownership owned
        inventory_patient_count:
          type: number
          description: number of inventories with ownership patient
        inventory_pay_per_use_count:
          type: number
          description: number of inventories with ownership pay-per-use
        inventory_rental_leasing_count:
          type: number
          description: number of inventories with ownership rental/leasing
        is_public:
          type: boolean
          description: boolean flag to make this device model public
        linked_image_id:
          type: string
          description: the id of an image to display as default
        manufacturer_according_to_type_plate:
          type: string
          description: manufacturer according to type plate
        manufacturer_company_contact_id:
          type: string
          nullable: true
          description: id of the manufacturer company contact
        manufacturer_product_url:
          type: string
          nullable: true
          description: URL with info about the product (main tenant language used)
        manufacturer_product_url_labels:
          "$ref": "#/components/schemas/translations"
        manufacturer_service_url:
          type: string
          nullable: true
          description: URL with info about service (main tenant language used)
        manufacturer_service_url_labels:
          "$ref": "#/components/schemas/translations"
        manufacturer_warranty_months:
          type: number
          nullable: true
          description: Manufacturer warranty in months
        network_connections:
          type: array
          description: supported network connections
          items:
            type: string
            enum:
            - w-lan
            - lan
            - bluetooth
        notified_body_ce:
          type: string
          nullable: true
          deprecated: true
          description: "(DEPRECATED), use regulatory instead"
        operator_ordinance:
          type: string
          enum:
          - annex_1
          - annex_1_2
          - annex_2
          - none
          description: operator ordinance
        publish_to_community_requested:
          type: boolean
          nullable: true
          description: Set to true to request to make this device model publically
            available for everyone.
        published:
          type: boolean
          description: Allows setting to false to prevent records from being available
          default: true
        published_languages:
          type: array
          uniqueItems: true
          items:
            type: string
            description: one of the tenant content_languages 2-digit (ISO-639-1) language
              code, marks this device model as available in the selected language
        responsible_company_contact_id:
          type: string
          nullable: true
          description: id of the current responsible company contact
        risk_category:
          type: string
          nullable: true
          enum:
          - life_support
          - non_life_support
          description: ECRI risk category (life support / non-life support)
        risk_level:
          type: string
          enum:
          - unknown
          - '0'
          - '1'
          - '2'
          description: "(original risk level) Application risk: (0: Self-explanatory,
            1: User instruction necessary, 2: Manufacturer instruction required)"
        risk_level_effective:
          type: string
          enum:
          - unknown
          - '0'
          - '1'
          - '2'
          description: "(effective risk level) Application risk: (0: Self-explanatory,
            1: User instruction necessary, 2: Manufacturer instruction required)"
        risk_level_override:
          type: string
          enum:
          - unknown
          - '0'
          - '1'
          - '2'
          description: "(optional facility override) Application risk: (0: Self-explanatory,
            1: User instruction necessary, 2: Manufacturer instruction required)"
        service_support_classification:
          type: string
          nullable: true
          enum:
          - class_1
          - class_2
          - class_3
          - class_4
          description: ECRI service support classification
        software_operating_system:
          type: string
          nullable: true
          description: The operating system running on the device
        stores_patient_data:
          type: boolean
          description: set to true if patient data is stored on the device
        tenant_name:
          type: string
          nullable: true
          readOnly: true
          description: name of owning tenant
        title:
          type: string
          description: device model title
        trust_level:
          type: string
          readOnly: true
          description: trust level of this record
          default: tenant
          enum:
          - manufacturer
          - supplier
          - community
          - tenant
        type_catalog_ids:
          type: array
          readOnly: true
          deprecated: true
          description: ids of type catalogs (obsolete, use single value field device_type_id
            instead)
          items:
            type: string
          nullable: true
        type_catalog_title:
          type: string
          deprecated: true
          description: "(DEPRECATED), use device_type_title instead"
          nullable: true
        type_catalog_titles:
          type: array
          deprecated: true
          description: "(DEPRECATED), use device_type_title instead)"
          items:
            type: string
          nullable: true
        udi:
          type: string
          nullable: true
          deprecated: true
          description: "(DEPRECATED), use regulatory instead"
        updated_at:
          type: string
          format: date_time
          readOnly: true
          description: system timestamp the record was last updated
        updated_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who last updated the record
        updated_by_user_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was last updated_by_user
        urn:
          type: string
          readOnly: true
          nullable: true
          description: Base AAS URN of this record
        urns:
          type: array
          readOnly: true
          nullable: true
          description: All AAS URNs of this device model
          items:
            type: string
        vendor_briefing_count:
          type: number
          description: number of manufacturer trainings of the catalog
        version:
          type: string
          nullable: true
          readOnly: true
          description: shows the range of first and last (if available) possible firmware
            version taken from `version_list`
        version_list:
          type: array
          nullable: true
          description: possible firmware versions this device can have (must be ordered
            from first to last)
          items:
            type: string
        version_number:
          type: number
          readOnly: true
          description: sorting number of versioned device models
    CatalogSerializer:
      type: object
      description: Limited attributes used for listings of device models
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
