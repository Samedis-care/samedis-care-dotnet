        schema:
          anyOf:
          - type: string
            nullable: true
          - type: string
            pattern: "^([0-9a-fA-F]{24})$"
          - type: string
            pattern: "^([0-9a-fA-F]{24})(?:,([0-9a-fA-F]{24}))*$"
      - name: filter[device_location_ids]
        in: query
