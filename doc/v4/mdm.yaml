      - name: gridfilter
        in: query
        schema:
          type: string
        description: |
          String in JSON format as described in https://github.com/Samedis-care/samedis-care-community/wiki/03---API-Gridfilter

          <details>
            <summary>The model defined these fields as allowed for filtering.</summary>

            `_id`, `_keywords`, `_keywords_device_type`, `_keywords_plain`, `aas_cached`, `aas_cached_at`, `annex_1`, `annex_2`, `annex_num`, `associated_version_ids`, `available_in_countries`, `base_version_id`, `blocking_key`, `briefings_total`, `ce`, `changelog_version`, `copy_of_device_model_id`, `created_at`, `created_by`, `created_by_user`, `created_by_user_mdm_edited`, `current_responsible_manufacturer`, `device_model_combo_search`, `device_tag_ids`, `device_type_id`, `device_type_tag_ids`, `device_type_title`, `device_type_title_labels`, `embedded_device_tags`, `embedding`, `emtec`, `emtec_code`, `emtec_device_id`, `end_of_life_at`, `end_of_service_at`, `enterprise_tenant_id`, `external_id`, `extra_keywords`, `facility_content_ids`, `iec_safety_class`, `iec_safety_type`, `importer_autocreated`, `inventories_total`, `is_placeholder`, `is_public`, `language`, `linked_image_data`, `linked_image_id`, `manufacturer_according_to_type_plate`, `manufacturer_aliases_cache`, `manufacturer_company_contact_id`, `manufacturer_product_url`, `manufacturer_product_url_labels`, `manufacturer_resolved`, `manufacturer_service_url`, `manufacturer_service_url_labels`, `manufacturer_warranty_months`, `network_connections`, `notified_body_ce`, `operator_ordinance`, `owner_tenant_id`, `publish_to_community_decided_at`, `publish_to_community_decision`, `publish_to_community_merge_device_model_id`, `publish_to_community_reply`, `publish_to_community_requested`, `publish_to_community_requested_at`, `publish_to_community_requested_by`, `publish_to_community_requested_by_user_id`, `published`, `published_languages`, `regulatory`, `related_data_checksum`, `responsible_company_contact_id`, `risk_category`, `risk_level`, `risk_level_overrides`, `sdh_entry_id`, `sdh_synced_at`, `service_intervals`, `service_support_classification`, `services`, `software_operating_system`, `staff_ids`, `stores_patient_data`, `tag`, `tags`, `team_ids`, `tenant_id`, `tenant_ids`, `tenant_name`, `title`, `title_compact`, `title_versioned`, `training_shared_version_ids`, `trust_level`, `type_catalog_ids`, `udi`, `updated_at`, `updated_by`, `updated_by_user`, `updated_by_user_at`, `updated_by_user_mdm_edited`, `urn`, `urns`, `vendor_briefings_total`, `version`, `version_list`, `version_number`, `with_service_intervals`, `with_service_intervals._id`, `with_service_intervals.category`, `with_service_intervals.label`, `with_service_intervals.labels`, `with_service_intervals.language`, `with_service_intervals.unit`, `with_service_intervals.value`

          </details>

          <details>
            <summary>These fields additionally support the full-text `search` condition (Atlas Search backend required).</summary>

            `current_responsible_manufacturer`, `device_type_title`, `emtec_code`, `extra_keywords`, `manufacturer_according_to_type_plate`, `notified_body_ce`, `title`, `udi`, `version`

            Query syntax (in `filter`): `+required` `-excluded` `a OR b` `foo*` / `f?o` (wildcards) `"exact phrase"`.

            `type`: `matches` (records matching the query) or `not_matches` (the complement).

            ```json
             {
               "current_responsible_manufacturer":{
                 "filterType":"search",
                 "type":"matches",
                 "filter":"+Katalog +Beatmung"
               }
             }
            ```

          </details>

          <details>
            <summary>Detailed example</summary>

            ```json
             {
               "created_at":{
                 "filterType":"date",
                 "type":"inRange",
                 "dateFrom":"2019-03-31",
                 "dateTo":"2019-07-31"
               },
               "sign_in_count":{
                 "condition1":{
                   "filterType":"number",
                   "type":"inRange",
                   "filter":0,
                   "filterTo":1000000
                 },
                 "condition2":{
                   "filterType":"number",
                   "type":"notEqual",
                   "filter":"666.777"
                 },
                 "filterType":"number",
                 "operator":"AND"
               },
               "email":{
                 "condition1":{
                   "filterType":"text",
                   "type":"contains",
                   "filter":"gmail.com"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"equals",
                   "filter":"tdouglas@domain.local"
                 },
                 "filterType":"text",
                 "operator":"OR"
               },
               "first_name":{
                 "condition1":{
                   "filterType":"text",
                   "type":"endsWith",
                   "filter":"gan"
                 },
                 "condition2":{
                   "filterType":"text",
                   "type":"startsWith",
                   "filter":"Te"
                 },
                 "filterType":"text",
                 "operator":"AND"
               },
               "last_name":{
                 "filterType":"text",
                 "type":"notContains",
                 "filter":"Brakus"
               },
               "active": {
                 "filterType": "bool",
                 "type": "equals",
                 "filter": true
               }
             }
            ```

          </details>
