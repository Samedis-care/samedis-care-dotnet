---
info:
  title: Samedis.care MDM API V4
  contact:
    name: Samedis Care GmbH
    email: info@samedis.care
    url: https://github.com/Samedis-care/samedis-care-community/wiki
  version: v4
  description: |-
    ## This is the Master Data Management API V4
    > The MDM (Master Data Management) allows the Samedis.care team and the community moderators to manage master data that is available globally.
    > For manufacturers who maintain their own device types and make them publicly available, they use the MDM to manage the data centrally.
    > Access to MDM is restrictive and must be enabled by the support team.
components:
  securitySchemes:
    Bearer:
      description: |
        # Token based authentication Header
        Authenticate and then copy the token into this field without the "Bearer " prefix.

        ## To obtain a bearer token
        Use the `https://ident.services/api/v1/samedis-care/oauth/token` endpoint.
        See [Ident Services API documentation](https://ident.services/api-docs/) for reference.
      type: http
      scheme: bearer
  schemas:
    CatalogOverviewSerializer:
      type: object
      description: Limited attributes used for listings of device models
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
          description: tenant id this record is owned by
        aas_shell_url:
          type: string
          readOnly: true
          nullable: true
          description: URL to fetch the full AAS shell of this device model
        associated_version_ids:
          type: array
          description: ids of versioned device models
          items:
            type: string
        available_in_countries:
          "$ref": "#/components/schemas/countries"
        briefing_count:
          type: number
          description: number of associated briefings of the catalog
        ce:
          type: boolean
          nullable: true
          deprecated: true
          description: "(DEPRECATED), use regulatory instead"
        created_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was created
        created_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who created the record
        current_responsible_manufacturer:
          type: string
          readOnly: true
          nullable: true
          description: current responsible manufacturer
        device_form_title:
          type: string
          deprecated: true
          description: "(DEPRECATED), use title instead"
          nullable: true
        device_picture:
          type: string
          nullable: true
          readOnly: true
          description: url to the device picture (if available)
        device_tag_ids:
          type: array
          description: ids of assigned device tags
          items:
            type: string
        device_type_category:
          type: string
          deprecated: true
          description: "(DEPRECATED), use device_type_title instead"
          nullable: true
        device_type_id:
          type: string
          description: device type id
        device_type_tag_ids:
          type: array
          description: ids of inherited device type tags
          items:
            type: string
        device_type_title:
          type: string
          readOnly: true
          description: device type title
        device_type_title_labels:
          "$ref": "#/components/schemas/translations_read_only"
        embedded_device_tags:
          type: array
          description: assigned device tags
          items:
            type: object
            description: |-
              Hash of locale-languages with translated tag names.
              Can be any 2 digit language code."
              Must be at least 2 characters,
              but no more than 80.
            properties:
              id:
                type: string
                readOnly: true
                description: unique record id
              type:
                type: string
                description: tag type
                enum:
                - area_of_application
                - device_type
                - purpose
                - technical_property
              name:
                type: string
                description: unique tag name lower+snakecase
              labels:
                "$ref": "#/components/schemas/translations_read_only"
        emtec_code:
          type: string
          nullable: true
          deprecated: true
          description: "(DEPRECATED), use regulatory instead"
        end_of_life:
          type: boolean
          readOnly: true
          description: true if end_of_life_at present and reached current date
        end_of_life_at:
          type: string
          format: date
          nullable: true
          example: '2026-12-31'
          description: possible date defined by manufacturer for the products end
            of life
        end_of_service:
          type: boolean
          readOnly: true
          description: true if end_of_service_at present and reached current date
        end_of_service_at:
          type: string
          format: date
          nullable: true
          example: '2026-06-30'
          description: possible date defined by manufacturer for the products end
            of service
        external_id:
          type: string
          maxLength: 50
          nullable: true
          description: optional unique (within tenant context) identifier that can
            be assigned by the facility
        iec_safety_class:
          type: string
          nullable: true
          enum:
          - class_1
          - class_2
          - internally_powered
          description: IEC 60601 safety (protection) class
        iec_safety_type:
          type: string
          nullable: true
          enum:
          - type_b
          - type_bf
          - type_cf
          description: IEC 60601 applied part type
        inventory_count:
          type: number
          description: number of inventories of the catalog
        inventory_loaner_device_count:
          type: number
          description: number of inventories with ownership loaner device
        inventory_owned_count:
          type: number
          description: number of inventories with ownership owned
        inventory_patient_count:
          type: number
          description: number of inventories with ownership patient
        inventory_pay_per_use_count:
          type: number
          description: number of inventories with ownership pay-per-use
        inventory_rental_leasing_count:
          type: number
          description: number of inventories with ownership rental/leasing
        is_public:
          type: boolean
          description: boolean flag to make this device model public
        linked_image_id:
          type: string
          description: the id of an image to display as default
        manufacturer_according_to_type_plate:
          type: string
          description: manufacturer according to type plate
        manufacturer_company_contact_id:
          type: string
          nullable: true
          description: id of the manufacturer company contact
        manufacturer_product_url:
          type: string
          nullable: true
          description: URL with info about the product (main tenant language used)
        manufacturer_product_url_labels:
          "$ref": "#/components/schemas/translations"
        manufacturer_service_url:
          type: string
          nullable: true
          description: URL with info about service (main tenant language used)
        manufacturer_service_url_labels:
          "$ref": "#/components/schemas/translations"
        manufacturer_warranty_months:
          type: number
          nullable: true
          description: Manufacturer warranty in months
        network_connections:
          type: array
          description: supported network connections
          items:
            type: string
            enum:
            - w-lan
            - lan
            - bluetooth
        notified_body_ce:
          type: string
          nullable: true
          deprecated: true
          description: "(DEPRECATED), use regulatory instead"
        operator_ordinance:
          type: string
          enum:
          - annex_1
          - annex_1_2
          - annex_2
          - none
          description: operator ordinance
        publish_to_community_requested:
          type: boolean
          nullable: true
          description: Set to true to request to make this device model publically
            available for everyone.
        published:
          type: boolean
          description: Allows setting to false to prevent records from being available
          default: true
        published_languages:
          type: array
          uniqueItems: true
          items:
            type: string
            description: one of the tenant content_languages 2-digit (ISO-639-1) language
              code, marks this device model as available in the selected language
        responsible_company_contact_id:
          type: string
          nullable: true
          description: id of the current responsible company contact
        risk_category:
          type: string
          nullable: true
          enum:
          - life_support
          - non_life_support
          description: ECRI risk category (life support / non-life support)
        risk_level:
          type: string
          enum:
          - unknown
          - '0'
          - '1'
          - '2'
          description: "(original risk level) Application risk: (0: Self-explanatory,
            1: User instruction necessary, 2: Manufacturer instruction required)"
        risk_level_effective:
          type: string
          enum:
          - unknown
          - '0'
          - '1'
          - '2'
          description: "(effective risk level) Application risk: (0: Self-explanatory,
            1: User instruction necessary, 2: Manufacturer instruction required)"
        risk_level_override:
          type: string
          enum:
          - unknown
          - '0'
          - '1'
          - '2'
          description: "(optional facility override) Application risk: (0: Self-explanatory,
            1: User instruction necessary, 2: Manufacturer instruction required)"
        service_support_classification:
          type: string
          nullable: true
          enum:
          - class_1
          - class_2
          - class_3
          - class_4
          description: ECRI service support classification
        software_operating_system:
          type: string
          nullable: true
          description: The operating system running on the device
        stores_patient_data:
          type: boolean
          description: set to true if patient data is stored on the device
        tenant_name:
          type: string
          nullable: true
          readOnly: true
          description: name of owning tenant
        title:
          type: string
          description: device model title
        trust_level:
          type: string
          readOnly: true
          description: trust level of this record
          default: tenant
          enum:
          - manufacturer
          - supplier
          - community
          - tenant
        type_catalog_ids:
          type: array
          readOnly: true
          deprecated: true
          description: ids of type catalogs (obsolete, use single value field device_type_id
            instead)
          items:
            type: string
          nullable: true
        type_catalog_title:
          type: string
          deprecated: true
          description: "(DEPRECATED), use device_type_title instead"
          nullable: true
        type_catalog_titles:
          type: array
          deprecated: true
          description: "(DEPRECATED), use device_type_title instead)"
          items:
            type: string
          nullable: true
        udi:
          type: string
          nullable: true
          deprecated: true
          description: "(DEPRECATED), use regulatory instead"
        updated_at:
          type: string
          format: date_time
          readOnly: true
          description: system timestamp the record was last updated
        updated_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who last updated the record
        updated_by_user_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was last updated_by_user
        urn:
          type: string
          readOnly: true
          nullable: true
          description: Base AAS URN of this record
        urns:
          type: array
          readOnly: true
          nullable: true
          description: All AAS URNs of this device model
          items:
            type: string
        vendor_briefing_count:
          type: number
          description: number of manufacturer trainings of the catalog
        version:
          type: string
          nullable: true
          readOnly: true
          description: shows the range of first and last (if available) possible firmware
            version taken from `version_list`
        version_list:
          type: array
          nullable: true
          description: possible firmware versions this device can have (must be ordered
            from first to last)
          items:
            type: string
        version_number:
          type: number
          readOnly: true
          description: sorting number of versioned device models
    CatalogUploadSerializer:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
          description: tenant id this record is owned by
        category:
          type: string
          description: category of this upload
          enum:
          - model
          - service
          - technical
          - training
          - regulatory
          default: model
        created_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was created
        created_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who created the record
        image_md5:
          type: string
          readOnly: true
          nullable: true
          description: MD5 checksum of uploaded file
        language:
          type: string
          description: 2 character language code, defaults to tenant default language
        mime_type:
          type: string
          description: mime type of the uploaded file
        name:
          type: string
          description: name of the uploaded file
        updated_at:
          type: string
          format: date_time
          readOnly: true
          description: system timestamp the record was last updated
        updated_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who last updated the record
        updated_by_user_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was last updated_by_user
    CatalogUploadSerializer.Links:
      type: object
      properties:
        document:
          type: string
          description: URL to the file
          format: uri-reference
    ContactOverviewSerializer:
      type: object
      required:
      - contact_type
      properties:
        id:
          type: string
          readOnly: true
          description: unique record id
        tenant_id:
          type: string
          readOnly: true
          description: tenant id this record is owned by
        _type:
          type: string
          enum:
          - Person
          - Company
          - Staff
          description: type of contact
          readOnly: true
        avatar:
          type: string
          format: uri-reference
          readOnly: true
          description: downloadable URL
        categories:
          type: array
          items:
            type: string
            enum:
            - consultation
            - waste_disposal
            - specialized_planning
            - commerce
            - manufacturer
            - inventorize
            - personnel_service_provider
            - inspection
            - repair
            - calibration
            - authorized_representative
        company_id:
          type: string
          nullable: true
          description: contact id of company type contact
        company_name:
          type: string
          nullable: true
          readOnly: true
          description: The company name for person contacts assigned to a company
        contact_type:
          anyOf:
          - type: string
            enum:
            - person
            - company
            - staff
            description: virtual attribute (not sortable) used to define the type
              of contact
          - type: string
            deprecated: true
            enum:
            - contact
            description: "(DEPRECATED) - use `person` instead"
        country: {}
        created_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was created
        created_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who created the record
        email:
          anyOf:
          - type: string
            format: email
            nullable: true
            description: email of contact person
          - "$ref": "#/components/schemas/null"
        fax:
          type: string
          nullable: true
          description: fax number (only for Company records)
        first_name:
          type: string
          nullable: true
          description: first name of person or company legal info
        ident_user_id:
          type: string
          nullable: true
          description: ident account user id
        is_public:
          type: boolean
          description: true if this record was made publically available
        last_name:
          type: string
          description: last name of person or company name
        mobile:
          type: string
          nullable: true
          description: mobile number (only for Person records)
        name:
          type: string
          description: name
        notes:
          type: string
          nullable: true
          description: notes about this contact
        phone:
          type: string
          nullable: true
          description: phone number
        salutation:
          type: string
          nullable: true
          description: salutation of person
        srn:
          type: string
          nullable: true
          description: EUDAMED SRN (Single Registration Number) only for Companies
        status:
          type: string
          deprecated: true
          description: "(DEPRECATED) status - used to control if contact is public
            or tenant specific - use `is_public` boolean instead"
          nullable: true
        street:
          type: string
          nullable: true
          description: street name
        town:
          type: string
          nullable: true
          description: town name
        trust_level:
          type: string
          description: trust level of this record
          default: tenant
        updated_at:
          type: string
          format: date_time
          readOnly: true
          description: system timestamp the record was last updated
        updated_by_user:
          type: string
          readOnly: true
          nullable: true
          description: name of the user who last updated the record
        updated_by_user_at:
          type: string
          format: date_time
          readOnly: true
          description: timestamp the record was last updated_by_user
        url:
          type: string
          nullable: true
          description: contact website (only for Company records)
        urn:
          type: string
          readOnly: true
          nullable: true
          description: Base AAS URN of this record (only applies to Manufacturer Companies)
        urns:
          type: array
          readOnly: true
          nullable: true
          description: All AAS URNs of this contact (only applies to Manufacturer
            Companies)
          items:
            type: string
        user_avatar:
          type: string
          readOnly: true
          nullable: true
          description: employee user avatar url
        zip:
          type: string
          nullable: true
          description: zip code
