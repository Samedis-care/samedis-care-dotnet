  "/api/v4/tenants/{tenant_id}/mdm/device_models/{device_model_id}/copy":
    post:
      summary: 'Device Model Copy: Create [POST]'
      tags:
      - Device Models
      operationId: tenants-mdm-devicemodels-copy-create
      x-controller: Api::V4::Tenants::Mdm::DeviceModels::CopyController
      x-controller-action: create
      x-controller-action-request-limit: 25
      x-controller-action-request-limit-duration: 60
      x-route-name: v4_tenant_mdm_device_model_copy_index
      x-candos:
      - samedis-care/catalogs.mdm-admin
      - samedis-care/catalogs.mdm-user
      x-model-type: Catalog
      x-record-type: catalog
      description: "Endpoint for creating copies of existing device models.\nCreates
        a copy of the given device_model_id that is not referenced\nto the original
        via versions.\n\n---\n\nTo use this endpoint the current user needs to be
        authorized for the\ntenant to do any of these\n\n - samedis-care/catalogs.mdm-admin\n
        - samedis-care/catalogs.mdm-user\n\n---\n\nThis endpoint is limited to\n25\nrequests
        per 60 seconds.\n\nIf this limit is exhausted the server will return HTTP
        status 429 \nAnd a header `Retry-After` with the number of seconds the client's
        user \naccount needs to wait before the endpoint will allow further requests.\n\nClients
        using this endpoint should implement a delay handling to wait the given\nseconds
        before retrying and avoid repeating previous requests that finished\nsuccessfully."
      security:
      - Bearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        description: Device Model Copy tenant_id
        schema:
          type: string
      - name: device_model_id
        in: path
        required: true
        description: Device Model Copy device_model_id
        schema:
          type: string
      - name: locale
        in: query
        description: to control the language returned
        schema:
          "$ref": "#/components/schemas/locales"
      responses:
        '200':
          description: Catalog created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                description: Single endpoints will return an object as data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        default: catalog
                      attributes:
                        "$ref": "#/components/schemas/Mdm.CatalogSerializer"
                      relationships:
                        "$ref": "#/components/schemas/relationships"
                  meta:
                    "$ref": "#/components/schemas/meta"
        '400':
          description: Some values that were sent couldn't be processed
          content:
            application/json:
              schema:
                type: object
                description: Check the returned info in meta/msg for details
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                description: Wait for so many seconds as returned in the Retry-After
                  header before accessing this endpoint again
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                description: Requires a valid login
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '402':
          description: Subscription required
          content:
            application/json:
              schema:
                type: object
                description: This feature requires some extra subscription that is
                  missing
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                type: object
                description: User is missing the access rights to do this
                properties:
                  meta:
                    "$ref": "#/components/schemas/meta"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Limited attributes used for listings of device models
                  properties:
                    available_in_countries:
                      "$ref": "#/components/schemas/countries"
                    ce:
                      type: boolean
                      nullable: true
                      deprecated: true
