        be later used to add device models to it.\n\nDevice types are organized in
        a tree structure with broader terms\nhigher up the tree. The first level of
        that structure will always\nbe an automatically created entry for the facility.\n\nNot
        that device types that are assigned to device models or those\nthat have further
        types below cannot be deleted until they aren't\nused anymore to prevent broken
        data relations.\n\n---\n\nTo use this endpoint the current user needs to be
        authorized for the\ntenant to do any of these\n\n - samedis-care/type-catalogs.mdm-admin\n
        - samedis-care/type-catalogs.mdm-user\n\n---\n\nThis endpoint is limited to\n100\nrequests
        per 60 seconds.\n\nIf this limit is exhausted the server will return HTTP
        status 429 \nAnd a header `Retry-After` with the number of seconds the client's
        user \naccount needs to wait before the endpoint will allow further requests.\n\nClients
        using this endpoint should implement a delay handling to wait the given\nseconds
        before retrying and avoid repeating previous requests that finished\nsuccessfully."
