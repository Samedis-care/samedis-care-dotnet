      description: "This endpoint manages own device models that, once set as published
        will be\npublically available for all facilities to use for inventory devices
        and trainings.\n\nNote that device models that are assigned to inventories
        by any facility cannot be\ndeleted until they aren't used anymore to prevent
        broken data relations.\n\n---\n\nTo use this endpoint the current user needs
        to be authorized for the\ntenant to do any of these\n\n - samedis-care/catalogs.mdm-admin\n
        - samedis-care/catalogs.mdm-user\n\n---\n\nThis endpoint is limited to\n100\nrequests
        per 60 seconds.\n\nIf this limit is exhausted the server will return HTTP
        status 429 \nAnd a header `Retry-After` with the number of seconds the client's
        user \naccount needs to wait before the endpoint will allow further requests.\n\nClients
        using this endpoint should implement a delay handling to wait the given\nseconds
        before retrying and avoid repeating previous requests that finished\nsuccessfully."
      security:
      - Bearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        description: Device Models tenant_id
        schema:
          type: string
      - name: locale
        in: query
        description: to control the language returned
        schema:
          "$ref": "#/components/schemas/locales"
      - name: format
        in: query
        description: this endpoint supports an alternate format for returned data
        schema:
          type: string
          enum:
          - json
          - xlsx
      - name: quickfilter
        in: query
        schema:
          type: string
        description: performs a search in keywords
      - name: page[number]
        in: query
        schema:
          type: string
        x-example: '1'
        description: |
          the page number (starts at 1, if not given or lower than 1 then
          page 1 will automatically be assumed)'
      - name: page[limit]
        in: query
        schema:
          type: string
        x-example: '10'
        description: the number of records per page (might be limited on the server
          side, use 0 to fetch no data to get only the total count)
      - name: padding
        in: query
        schema:
          type: string
        x-example: '0'
        description: 'manually adjust db offset: (page*per_page)+padding not required
          for normal paging, in doubt omit'
      - name: sort
        in: query
        schema:
          type: string
        description: |
          JSON Array of Objects to sort the results by one
          or more fields in the requested order.
          Example:
          `[{ property: "field1", direction: "ASC" }, { property: "field2", direction: "DESC" }]`
      - name: gridfilter
        in: query
        schema:
          type: string
        description: |
          String in JSON format as described in https://github.com/Samedis-care/samedis-care-community/wiki/03---API-Gridfilter

